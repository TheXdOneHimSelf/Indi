name: Run bot

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: "bot"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Cache pip downloads
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        pip install --no-cache-dir --prefer-binary -r requirements.txt

    - name: Fetch config.yml
      env:
        token: ${{ secrets.PAT_TOKEN }}
      run: |
        curl -s -H "Authorization: token $token" \
             -H "Accept: application/vnd.github.v3.raw" \
             -o config.yml \
             https://api.github.com/repos/TheXdOneHimSelf/configs/contents/Sooraj.yml

    - name: Setup engines
      run: |      
        echo "🔧 Setting engine permissions..."
        chmod +x engines/stockfish
        echo "📋 Listing engines:"
        ls -la engines/

    - name: Configure bot
      run: |
        sed -i "s/XXXXXXXXXXXXXXXXXXX/${{ secrets.TOKEN1 }}/g" config.yml

    - name: Launch bot
      run: |
        echo "Starting SKPS"
        python -u user_interface.py &
        wait
      
    - name: 🔁 Self-Restart
      run: gh workflow run "Run bot"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
